name: skrutai-web gate and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      MONITORING_ALERT_WEBHOOK_URL: ${{ secrets.MONITORING_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - id: eval
        run: npm run eval:pre-ship -w skrutai-web
      - name: Deploy web app to Vercel
        if: success()
        working-directory: apps/web
        run: npx vercel deploy --prod --yes --project prj_BJsV0KwqaaIfKIyYtLkoNxQNSHPJ --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Notify gate failure
        if: steps.eval.outcome == 'failure'
        run: |
          node -e "const fs=require('fs'); const url=process.env.MONITORING_ALERT_WEBHOOK_URL; if(!url){console.log('Pre-ship eval failed, but MONITORING_ALERT_WEBHOOK_URL is missing.'); process.exit(0);} const file='apps/web/.data/pre-ship-eval.json'; if(!fs.existsSync(file)){console.log('Pre-ship eval failed, but result file is missing.'); process.exit(0);} const result=JSON.parse(fs.readFileSync(file,'utf8')); console.log('Sending pre-ship failure alert to monitoring webhook...'); fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'github-actions-pre-ship',project:'skrutai-web',metrics:{hallucination:result.judgment.hallucination,ragPrecision:result.judgment.ragPrecision,ragRecall:result.judgment.ragRecall,security:result.judgment.security},question:'How does the bootcamp platform stay safe before and after ship?',answer:result.answer,model:process.env.OPENAI_MODEL})}).then(async (response)=>{if(!response.ok){console.log('Monitoring webhook failed with status', response.status); console.log(await response.text()); process.exit(1);} console.log('Monitoring webhook sent successfully with status', response.status);}).catch((error)=>{console.error('Monitoring webhook request failed'); console.error(error); process.exit(1);});"
